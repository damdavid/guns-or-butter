<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Global Dilemma: Guns or Butter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>The Global Dilemma<span>Guns or Butter</span></h1>
      <div id="phases" class="phases"></div>
      <div id="standing" class="standing"></div>
    </header>

    <main>
      <section class="pane map-pane">
        <div id="map"></div>
        <p id="map-hint" class="hint"></p>
      </section>

      <section id="side" class="pane side"></section>
    </main>

    <footer>
      <button id="advance" type="button"></button>
      <button id="undo" type="button" hidden>Undo turn</button>
      <span id="notice" class="notice"></span>
    </footer>

    <script type="module" src="dist/app.js"></script>
  </body>
</html>
