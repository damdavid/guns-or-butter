<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>The Global Dilemma: Guns or Butter</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>The Global Dilemma<span>Guns or Butter</span></h1>
      <div id="phases" class="phases"></div>
      <div id="standing" class="standing"></div>
    </header>

    <main>
      <section class="pane map-pane">
        <div class="map-tools">
          <button id="zoom-in" type="button" title="Zoom in">+</button>
          <button id="zoom-out" type="button" title="Zoom out">&minus;</button>
          <button id="zoom-fit" type="button" title="Fit the continent">Fit</button>
          <span id="map-hint" class="hint"></span>
        </div>
        <div id="map"></div>
      </section>

      <section class="side">
        <div id="inspector" class="pane inspect" hidden></div>
        <div id="panel" class="pane"></div>
        <div id="nations" class="pane"></div>
      </section>
    </main>

    <footer>
      <button id="advance" type="button"></button>
      <button id="undo" type="button" hidden>Undo turn</button>
      <span id="notice" class="notice"></span>
    </footer>

    <script type="module" src="dist/app.js"></script>
  </body>
</html>
